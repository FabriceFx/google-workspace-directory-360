 *  APLATISSEMENT — toute la profondeur du JSON Directory
 * ======================================================================== */
function flatten(user){
  var out = {};

  // écriture directe : pas de dictionnaire intermédiaire recopié ensuite
  function add(path, val){
    if (val === null || val === undefined || val === '') return;
    var a = out[path];
    if (a) a.push(val); else out[path] = [val];
  }

  function walk(node, prefix, sink){
    var ks = Object.keys(node);
    for (var i = 0; i < ks.length; i++){
      var k = ks[i], v = node[k];
      if (v === null || v === undefined) continue;
      var p = prefix ? prefix + '.' + k : k;
      if (Array.isArray(v)) arr(v, p, sink);
      else if (typeof v === 'object') walk(v, p, sink);
      else sink(p, v);
    }
  }

  function arr(list, p, sink){
    for (var i = 0; i < list.length; i++){
      var el = list[i];
      if (el === null || el === undefined) continue;
      if (typeof el !== 'object'){ sink(p, el); continue; }

      // enveloppe pure {value: x} — champs de schéma personnalisé multivalués
      var ks = Object.keys(el);
      if (ks.length === 1 && ks[0] === 'value'){
        sink(p, el.value);
        sink(p + '.value', el.value);
        continue;
      }

      var sub = {};
      walk(el, '', function(sp, v){
        var a = sub[sp];
        if (a) a.push(v); else sub[sp] = [v];
      });

      var q = qualifier(el), prim = (el.primary === true);
      var qp = q ? p + '[' + q + ']' : '';
      var sps = Object.keys(sub);
      for (var j = 0; j < sps.length; j++){
        var sp = sps[j], vs = sub[sp];
        for (var m = 0; m < vs.length; m++){
          var val = vs[m];
          sink(p + '.' + sp, val);
          if (qp){
            sink(qp + '.' + sp, val);
            if (sp === 'value' || sp === 'address' || sp === 'formatted') sink(qp, val);
          }
          if (prim) sink(p + '[primary].' + sp, val);
        }
      }
    }
  }

  function qualifier(el){
    if (el.type && el.type !== 'custom') return String(el.type);
    if (el.customType) return String(el.customType);
    if (el.type) return String(el.type);
    if (el.languageCode) return String(el.languageCode);
    return '';
  }

  walk(user, '', add);
  derive(user, add);
  return out;
}

/**
 * Indicateurs dérivés, groupe « calc ». Ils n'existent pas dans l'API mais
 * répondent aux questions qu'on pose réellement à un annuaire.
 */
function derive(u, add){
  var now = Date.now(), alertes = [];
  function put(k, v){ add('calc.' + k, v); }

  // --- Connexion ---
  var ll = u.lastLoginTime, t = ll ? Date.parse(ll) : NaN;
  var jamais = !ll || String(ll).indexOf('1970') === 0 || isNaN(t);
  put('jamaisConnecte', jamais);
  if (!u.suspended){
    if (jamais){ alertes.push('jamais connecté'); }
    else {
      var j = Math.floor((now - t) / 86400000);
      put('joursDepuisConnexion', j);
      put('anneeDerniereConnexion', String(ll).substring(0, 4));
      if (j > 365) alertes.push('inactif +365j');
      else if (j > 180) alertes.push('inactif +180j');
      else if (j > 90) alertes.push('inactif +90j');
    }
  }

  // --- Ancienneté ---
  if (u.creationTime){
    var c = Date.parse(u.creationTime);
    if (!isNaN(c)){
      put('ancienneteAnnees', Math.floor((now - c) / 31557600000));
      put('anneeCreation', String(u.creationTime).substring(0, 4));
    }
  }

  // --- Identité / adresse ---
  var mail = String(u.primaryEmail || '');
  if (mail.indexOf('@') !== -1){
    put('identifiant', mail.split('@')[0]);
    put('domaine', mail.split('@')[1]);
  }
  put('nbEmails', (u.emails || []).length);
  put('nbAlias', (u.aliases || []).length);
  put('nbAliasNonModifiables', (u.nonEditableAliases || []).length);

  // --- Téléphonie ---
  var ph = u.phones || [];
  put('nbTelephones', ph.length);
  put('aMobile', ph.some(function(x){ return x.type === 'mobile'; }));
  put('aPosteInterne', ph.some(function(x){ return /^\d{3,6}$/.test(String(x.value || '')); }));

  // --- Hiérarchie / OU ---
  var mgr = (u.relations || []).filter(function(r){ return r.type === 'manager'; });
  put('aManager', mgr.length > 0);
  var ou = u.orgUnitPath || '/';
  put('profondeurOU', ou === '/' ? 0 : ou.split('/').length - 1);
  put('ouRacine', ou === '/' ? '/' : '/' + ou.split('/')[1]);

  // --- Sécurité & Rôle ---
  var admin = !!(u.isAdmin || u.isDelegatedAdmin);
  put('estAdmin', admin);

  if (u.recoveryEmail && mail.indexOf('@') !== -1){
    var dr = String(u.recoveryEmail).split('@')[1] || '';
    put('recuperationExterne', dr.toLowerCase() !== mail.split('@')[1].toLowerCase());
  }

  // --- Évaluation automatique des alertes via le registre AUDIT_RULES ---
  AUDIT_RULES.forEach(function(r){
    if (r.alertTag && r.test(u)){
      alertes.push(r.alertTag);
    }
  });

  // --- Complétude des schémas personnalisés ---
  var cs = u.customSchemas || {}, tot = 0, ok = 0, vides = [];
  Object.keys(cs).forEach(function(sc){
    Object.keys(cs[sc]).forEach(function(fn){
      tot++;
      var v = cs[sc][fn];
      if (v === '' || v === null || v === undefined || (Array.isArray(v) && !v.length)) vides.push(sc + '.' + fn);
      else ok++;
    });
  });
  if (tot){
    put('completudeSchemas', Math.round(ok * 100 / tot));
    vides.forEach(function(v){ add('calc.champsSchemaVides', v); });
  }

  // --- Synthèse ---
  put('nbAlertes', alertes.length);
  put('conforme', alertes.length === 0);
  alertes.forEach(function(a){ add('calc.alertes', a); });
}

/* ==========================================================================
 *  INDEXATION + CATALOGUE
 * ======================================================================== */
var CARD_CAP = 3000;   // au-delà, on cesse de mémoriser les valeurs distinctes

/** Aplatit et indexe une tranche, sans toucher au catalogue. */
function indexRows(users){
  for (var i = 0; i < users.length; i++){
    var u = users[i];
    S.rows.push({ u:u, f:flatten(u), s:JSON.stringify(u).toLowerCase() });
  }
}

/** Construit le catalogue à partir des lignes déjà indexées. */
function buildIndex(){
  var map = {};
  S.rows.forEach(function(r){
    Object.keys(r.f).forEach(function(p){
      var e = map[p] || (map[p] = { path:p, count:0, vals:{}, distinct:0, types:{} });
      e.count++;
      r.f[p].forEach(function(v){
        var k = String(v);
        if (e.vals[k] === undefined){
          if (e.distinct >= CARD_CAP){ e.capped = true; e.distinct++; e.types[typeOf(v)] = 1; return; }
          e.vals[k] = 0; e.distinct++;
        }
        e.vals[k]++;
        e.types[typeOf(v)] = 1;
      });
    });
  });

  // Champs de schémas personnalisés déclarés mais jamais renseignés
  (S.schemas || []).forEach(function(sc){
    (sc.fields || []).forEach(function(fl){
      var p = 'customSchemas.' + sc.schemaName + '.' + fl.fieldName;
      if (!map[p]) map[p] = { path:p, count:0, vals:{}, distinct:0, types:{}, declared:true };
    });
  });
  // Champs standard de la projection "full" absents du jeu chargé
  KNOWN_PATHS.forEach(function(p){
    if (!map[p]) map[p] = { path:p, count:0, vals:{}, distinct:0, types:{}, declared:true };
  });

  var n = S.rows.length || 1;
  S.catalog = Object.keys(map).map(function(p){
    var e = map[p];
    var tops = Object.keys(e.vals).map(function(k){ return [k, e.vals[k]]; })
                     .sort(function(a,b){ return b[1]-a[1]; });
    return {
      path: p, count: e.count, fill: e.count / n, distinct: e.distinct,
      type: pickType(e.types), top: tops.slice(0, 400), declared: !!e.declared, capped: !!e.capped,
      group: p.split(/[.\[]/)[0]
    };
  }).sort(function(a,b){ return a.path.localeCompare(b.path, LOC()); });

  S.byPath = {};
  S.catalog.forEach(function(c){ S.byPath[c.path] = c; });
}

function typeOf(v){
  if (typeof v === 'boolean') return 'bool';
  if (typeof v === 'number') return 'num';
  if (typeof v === 'string' && DATE_RE.test(v)) return 'date';
  return 'str';
}
function pickType(t){
  if (t.date) return 'date';
  if (t.bool && !t.str && !t.num) return 'bool';
  if (t.num && !t.str) return 'num';
  return 'str';
}
/**
 * Résolution d'un chemin : exact, sinon par suffixe exact (« Matricule » ->
 * « customSchemas.RH.Matricule »). La correspondance par sous-chaîne, elle,
 * pouvait lier un libellé à un champ sans rapport sur un autre domaine.
 */
function resolvePath(p){
  if (S.byPath[p]) return p;
  var hit = S.catalog.filter(function(c){
    return c.path === p || c.path.slice(-(p.length + 1)) === '.' + p;
  });
  return hit.length ? hit[0].path : p;
}
function vals(row, path){ return row.f[path] || []; }

/* ==========================================================================
 *  MOTEUR DE FILTRES
 * ======================================================================== */
function testOne(row, flt){
  if (!flt || !flt.path) return true;
  var vs = vals(row, flt.path);
  var op = flt.op, needle = String(flt.val == null ? '' : flt.val);
  var nl = needle.toLowerCase(), nn = squash(nl);

  if (op === 'empty')  return vs.length === 0;
  if (op === 'nempty') return vs.length > 0;
  if (!vs.length) return (op === 'ncontains' || op === 'neq');

  // chaque valeur est testée telle quelle ET dépouillée de ses séparateurs,
  // pour que « 625 » retrouve « +33 6 25 42 04 62 »
  var any = function(fn){
    return vs.some(function(v){
      return forms(String(v).toLowerCase()).some(function(s){ return fn(s, v); });
    });
  };
  var all = function(fn){
    return vs.every(function(v){
      return forms(String(v).toLowerCase()).every(function(s){ return fn(s, v); });
    });
  };

  switch(op){
    case 'contains':  return any(function(s){ return s.indexOf(nl) !== -1 || (nn && s.indexOf(nn) !== -1); });
    case 'ncontains': return all(function(s){ return s.indexOf(nl) === -1 && (!nn || s.indexOf(nn) === -1); });
    case 'eq':        return any(function(s){ return s === nl || (nn && s === nn); });
    case 'neq':       return all(function(s){ return s !== nl && (!nn || s !== nn); });
    case 'starts':    return any(function(s){ return s.indexOf(nl) === 0 || (nn && s.indexOf(nn) === 0); });
    case 'ends':      return any(function(s){ return nl !== '' && (s.lastIndexOf(nl) === s.length - nl.length || (nn && s.lastIndexOf(nn) === s.length - nn.length)); });
    case 'in':
      var set = nl.split(/[,;]/).map(function(x){ return x.trim(); }).filter(Boolean);
      return any(function(s){ return set.indexOf(s) !== -1; });
    case 'regex':
      var re; try { re = new RegExp(needle, 'i'); } catch(e){ return false; }
      return any(function(s, v){ return re.test(String(v)); });
    case 'gt': case 'gte': case 'lt': case 'lte':
      return any(function(s, v){ return cmp(v, needle, op); });
    case 'older': case 'newer':
      var d = parseFloat(needle); if (isNaN(d)) return false;
      var lim = Date.now() - d * 86400000;
      return any(function(s, v){
        var t = Date.parse(v); if (isNaN(t)) return false;
        return op === 'older' ? t < lim : t >= lim;
      });
  }
  return true;
}
function squash(s){
  var n = String(s).replace(/[\s.\-()\/]/g, '');
  return n === String(s) ? '' : n;
}
function forms(s){
  var n = squash(s);
  return n ? [s, n] : [s];
}
function cmp(v, needle, op){
  var a, b;
  if (DATE_RE.test(String(v)) || /^\d{4}-\d{2}-\d{2}/.test(needle)){
    a = Date.parse(v); b = Date.parse(needle);
  } else { a = parseFloat(v); b = parseFloat(needle); }
  if (isNaN(a) || isNaN(b)){ a = String(v).toLowerCase(); b = String(needle).toLowerCase(); }
  if (op === 'gt') return a > b;
  if (op === 'gte') return a >= b;
  if (op === 'lt') return a < b;
  return a <= b;
}

function applyQuery(){
  var q = S.search.trim().toLowerCase();
  // Un critère dont la valeur n'est pas encore saisie est en attente, pas
  // faux : l'appliquer renverrait zéro résultat et laisserait croire à une
  // absence de données.
  var active = S.filters.filter(function(f){
    return f.path && (f.val !== '' || f.op === 'empty' || f.op === 'nempty');
  });

  S.result = S.rows.filter(function(row){
    if (q && row.s.indexOf(q) === -1) return false;
    if (!active.length) return true;
    if (S.logic === 'AND') return active.every(function(f){ return testOne(row, f); });
    return active.some(function(f){ return testOne(row, f); });
  });

  var p = S.sort.path, d = S.sort.dir;
  S.result.sort(function(x, y){
    var a = (x.f[p] || [])[0], b = (y.f[p] || [])[0];
    if (a === undefined && b === undefined) return 0;
    if (a === undefined) return 1;
    if (b === undefined) return -1;
    if (typeof a === 'number' && typeof b === 'number') return (a - b) * d;
    var aDate = DATE_RE.test(String(a)), bDate = DATE_RE.test(String(b));
    if (aDate && bDate) return (Date.parse(a) - Date.parse(b)) * d;
    if (aDate) return -1 * d;
    if (bDate) return 1 * d;
    return String(a).localeCompare(String(b), LOC(), { numeric:true }) * d;
  });

  S.page = 1;
  render();
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c];
  });
}
function prettyPath(p){
  return esc(p).replace(/\[([^\]]+)\]/g, '[<em>$1</em>]');
}

function cell(v){
  if (v === true)  return '<span class="tag t">' + T('vrai') + '</span>';

    return esc(s.substring(0, 10) + ' ' + s.substring(11, 16));

function renderTable(){

    return '<th data-sort="' + esc(p) + '" title="' + esc(p) + '">' + esc(shortLabel(p)) + ar + '</th>';

  });
  var rows = Object.keys(counts).map(function(k){ return [k, counts[k]]; })
                   .sort(function(a, b){ return b[1] - a[1]; });
  if (vide) rows.push([T('nonRenseigne'), vide]);
  var max = rows.length ? Math.max.apply(null, rows.map(function(r){ return r[1]; })) : 1;

  v.innerHTML = '<div class="pivot-h">'
    + '<strong>' + T('repartitionPar') + '</strong>'

    + '<button class="btn" id="pvCsv" style="margin-left:auto">↓ CSV</button></div>'
    + '<table class="pv"><thead><tr><th style="width:44%">' + T('colValeur') + '</th><th style="width:90px">' + T('colComptes') + '</th><th style="width:70px">%</th><th>' + T('colPoids') + '</th></tr></thead><tbody>'
    + rows.map(function(r){
        return '<tr><td class="v" data-pv="' + esc(r[0]) + '">' + esc(r[0]) + '</td>'

function colorJson(txt){
  return esc(txt)
    .replace(/&quot;([^&]*?)&quot;(\s*:)/g, '<span class="k">"$1"</span>$2')
    .replace(/: &quot;(.*?)&quot;/g, ': <span class="s">"$1"</span>')
    .replace(/: (true|false|null)/g, ': <span class="b">$1</span>')
    .replace(/: (-?\d+\.?\d*)/g, ': <span class="n">$1</span>');
}
function safeCsv(v){
  var s = String(v || '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCsv(){
  if (!S.result.length){ toast(T('aucunExport')); return; }
  var sep = ';';
  var head = S.cols.join(sep);

    return S.cols.map(function(p){
      return safeCsv((r.f[p] || []).join(' | '));
    }).join(sep);
  });
  download('annuaire_' + new Date().toISOString().substring(0, 10) + '.csv',

/**
 * Export vers Google Sheets : le serveur cr\u00E9e le classeur (propri\u00E9t\u00E9 du compte
 * de d\u00E9ploiement), le range et le partage en lecture avec le demandeur.
 */
function exportSheet(){
  if (!S.result.length){ toast(T('aucunExport')); return; }
  var cols = S.cols.slice();
  var rows = S.result.map(function(r){
    return cols.map(function(p){ return (r.f[p] || []).join(' | '); });
  });
  toast(T('exportSheetEnCours'));
  google.script.run.withSuccessHandler(function(res){
    if (!res || !res.ok){ banner('err', srvMsg(res)); return; }
    logEvent('sheet', res.count);
    var d = document.createElement('div');
    d.className = 'banner ok';
    d.innerHTML = esc(T('exportSheetOk')) + ' <a href="' + esc(res.url) + '" target="_blank" rel="noopener">' + esc(res.name) + '</a>';
    document.getElementById('banners').appendChild(d);
  }).withFailureHandler(function(e){
    banner('err', T('echecChargement') + (e && e.message ? e.message : e));
  }).apiExportToSheet({ cols: cols, rows: rows });
}
function download(name, txt){
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(txt);
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

/* Opérateurs proposés selon le type du champ : on ne montre que ce qui a du
   sens, un novice ne doit pas arbitrer entre 16 possibilités. */
var OPS_SIMPLES = {
  bool: [['eq', 'est', 'is']],
  date: [['older', 'date de plus de … jours', 'date older than … days'],
         ['newer', 'date de moins de … jours', 'date newer than … days'],
         ['empty', 'n\'est pas renseignée', 'is not set'],
         ['nempty', 'est renseignée', 'is set']],
  num:  [['eq', 'est égal à', 'equals'],
         ['gt', 'est supérieur à', 'is greater than'],
         ['lt', 'est inférieur à', 'is less than'],
         ['empty', 'n\'est pas renseigné', 'is not set'],
         ['nempty', 'est renseigné', 'is set']],
  str:  [['eq', 'est', 'is'],
         ['contains', 'contient', 'contains'],
         ['neq', 'n\'est pas', 'is not'],
         ['empty', 'n\'est pas renseigné', 'is not set'],
         ['nempty', 'est renseigné', 'is set']]
};

function opsFor(type){
  var src = OPS_SIMPLES[type] || OPS_SIMPLES.str;
  return src.map(function(o){ return [o[0], o[LANG === 'en' ? 2 : 1]]; });
}

/**
 * Assemble le vocabulaire du mode simple : socle standard + champs
 * personnalisés du domaine, découverts via Schemas.list puis, à défaut, dans
 * les données elles-mêmes. Un libellé dont le champ n'existe pas sur ce
 * domaine est écarté : mieux vaut une liste plus courte qu'un critère mort.
 */
function buildLabels(){
  var out = [], vus = {};
  function add(g, l, p){
    if (!S.byPath[p] || vus[p]) return;
    vus[p] = 1; out.push({ g:g, l:l, p:p });
  }

  // Un domaine peut ne pas utiliser les types standard (« mobile », « desk »…) :
  // on retombe alors sur le chemin non qualifié plutôt que de perdre le champ.
  LABELS.forEach(function(L){
    var p = resolvePath(L.p);
    if (!S.byPath[p] && L.p.indexOf('[') !== -1){
      p = resolvePath(L.p.replace(/\[[^\]]+\]/, ''));
    }
    add(T(L.g), TL(L), p);
  });

  // Champs personnalisés. Un domaine peut en déclarer des centaines : on ne
  // retient que ceux réellement renseignés, les mieux remplis d'abord, et on
  // plafonne — une liste déroulante de 600 entrées n'aide personne.
  var perso = [], vusPerso = {};
  function candidat(groupe, libelle, chemin){
    var c = S.byPath[chemin];
    if (!c || vusPerso[chemin]) return;
    vusPerso[chemin] = 1;
    perso.push({ g:groupe, l:libelle, p:chemin, n:c.count });
  }

  // a) schémas déclarés dans la console : libellés d'affichage soignés
  (S.schemas || []).forEach(function(sc){
    var g = sc.displayName || sc.schemaName.replace(/_/g, ' ');
    (sc.fields || []).forEach(function(f){
      candidat(g, f.displayName || f.fieldName.replace(/_/g, ' '),
               'customSchemas.' + sc.schemaName + '.' + f.fieldName);
    });
  });

  // b) filet de sécurité : schémas vus dans les données mais absents de
  //    Schemas.list (droit « Schémas personnalisés » non accordé)
  S.catalog.forEach(function(c){
    if (c.path.indexOf('customSchemas.') !== 0) return;
    var seg = c.path.split('.');
    if (seg.length !== 3) return;
    candidat(seg[1].replace(/_/g, ' '), seg[2].replace(/_/g, ' '), c.path);
  });

  var parSchema = {}, retenus = 0;
  perso.filter(function(x){ return x.n > 0; })
       .sort(function(a, b){ return b.n - a.n || a.l.localeCompare(b.l, LOC()); })
       .forEach(function(x){
         parSchema[x.g] = (parSchema[x.g] || 0);
         if (parSchema[x.g] >= BRAND.maxChampsParSchema) return;
         if (retenus >= BRAND.maxChampsPersoTotal) return;
         parSchema[x.g]++; retenus++;
         x.retenu = 1;
       });
  // remis dans l'ordre de déclaration, groupe par groupe
  perso.filter(function(x){ return x.retenu; })
       .sort(function(a, b){ return a.g.localeCompare(b.g, LOC()); })
       .forEach(function(x){ add(x.g, x.l, x.p); });
  S.persoIgnores = perso.filter(function(x){ return x.n > 0 && !x.retenu; }).length;

  S.labels = out;
  S.labelPath = out.map(function(x){ return x.p; });

  // jeu de colonnes « Champs perso. » du mode expert
  COLSETS.rh = ['primaryEmail', 'name.fullName'].concat(
    out.filter(function(o){ return o.p.indexOf('customSchemas.') === 0; })
       .slice(0, 8).map(function(o){ return o.p; }));
  if (COLSETS.rh.length === 2) COLSETS.rh = COLSETS.rh.concat(['organizations.department', 'organizations.title']);
}

function labelOf(path){
  var l = (S.labels || []).filter(function(x){ return x.p === path; })[0];
  return l ? l.l : path;
}

/**
 * Une question est proposée dès que ses CRITÈRES existent sur ce domaine.
 * Les colonnes, elles, sont facultatives : une colonne absente est retirée de
 * l'affichage, elle ne doit pas faire disparaître une question qui fonctionne.
 */
function questionsDispo(){
  return QUESTIONS.map(function(q, i){ return { q:q, i:i }; })
    .filter(function(o){
      return o.q.f.every(function(f){ return S.byPath[resolvePath(f[0])]; });
    });
}

  if (!out.length) out = COLS_DEFAUT.map(resolvePath).filter(function(p){ return S.byPath[p]; });

function renderSRows(){
  var box = document.getElementById('sRows');
  if (!S.filters.length){
    box.innerHTML = '<div class="hint">' + esc(T('aucunCritere').replace('{n}', nb(S.rows.length))) + '</div>';
  } else {
    box.innerHTML = S.filters.map(function(f, i){
      var c = S.byPath[f.path] || { type:'str', distinct:0, top:[] };
      var ops = opsFor(c.type);
      // Un opérateur venu d'une question ou du mode expert peut sortir du jeu
      // simplifié : on l'ajoute à la liste plutôt que de réécrire le critère.
      if (!ops.some(function(o){ return o[0] === f.op; })){
        ops = ops.concat([[f.op, opLabel(f.op)]]);
      }

      var champs = '';
      var grp = '';
      (S.labels || []).forEach(function(L){
        if (L.g !== grp){ if (grp) champs += '</optgroup>'; grp = L.g; champs += '<optgroup label="' + esc(grp) + '">'; }
        champs += '<option value="' + esc(L.p) + '"' + (L.p === f.path ? ' selected' : '') + '>' + esc(L.l) + '</option>';
      });
      if (grp) champs += '</optgroup>';

      return '<div class="srow" data-i="' + i + '">'
        + '<span class="lk">' + (i === 0 ? T('lesComptesDont') : (S.logic === 'AND' ? T('et_min') : T('ou_min'))) + '</span>'
        + '<select class="f sf">' + champs + '</select>'
        + '<select class="so">' + ops.map(function(o){
            return '<option value="' + o[0] + '"' + (o[0] === f.op ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
          }).join('') + '</select>'
        + valueControl(f, c, i)
        + '<button class="x" data-sdel>✕</button>'
        + '</div>';
    }).join('');
  }

  document.getElementById('sLogic').innerHTML = S.filters.length > 1
    ? '<span>' + esc(T('correspondSi')) + '</span>'
      + '<span class="seg">'
      + '<button class="sg' + (S.logic === 'AND' ? ' on' : '') + '" data-lg="AND">' + esc(T('tousCriteres')) + '</button>'
      + '<button class="sg' + (S.logic === 'OR' ? ' on' : '') + '" data-lg="OR">' + esc(T('auMoinsUn')) + '</button>'
      + '</span>'
    : '';
}

/* Le novice ne peut pas deviner la valeur exacte : on la lui propose. */
function valueControl(f, c, i){
  if (f.op === 'empty' || f.op === 'nempty') return '<span class="w">' + esc(T('dansAnnuaire')) + '</span>';
  if (c.type === 'bool'){
    // Un <select> sans option selected affiche la première : l'utilisateur lit
    // « Oui » pendant que l'état interne reste vide, et le critère est ignoré.
    // On aligne donc l'état sur ce qui est montré, dès la construction.
    if (String(f.val) !== 'true' && String(f.val) !== 'false') f.val = 'true';
    return '<select class="val sv">'
      + '<option value="true"' + (String(f.val) === 'true' ? ' selected' : '') + '>' + esc(T('oui')) + '</option>'
      + '<option value="false"' + (String(f.val) === 'false' ? ' selected' : '') + '>' + esc(T('non')) + '</option></select>';
  }
  if (c.type === 'date' || c.type === 'num'){
    return '<input type="number" class="val sv" value="' + esc(f.val) + '" placeholder="'
      + (c.type === 'date' ? T('nbJours') : T('valeur')) + '" style="width:150px">';
  }
  var vals = (c.top || []).map(function(t){ return t[0]; }).sort(function(a, b){ return a.localeCompare(b, LOC()); });
  if (vals.length && vals.length <= 80){
    var html = '<select class="val sv"><option value="">' + esc(T('choisir')) + '</option>';
    var found = false;
    html += vals.map(function(v){
      if (v === f.val) found = true;
      return '<option value="' + esc(v) + '"' + (v === f.val ? ' selected' : '') + '>' + esc(v.substring(0, 70)) + '</option>';
    }).join('');
    if (f.val && !found) {
      html += '<option value="' + esc(f.val) + '" selected>' + esc(String(f.val).substring(0, 70)) + '</option>';
    }
    return html + '</select>';
  }
  return '<input type="text" class="val sv" list="dlv' + i + '" value="' + esc(f.val) + '" placeholder="' + T('saisirValeur') + '">'
    + '<datalist id="dlv' + i + '">' + vals.slice(0, 200).map(function(v){ return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>';
}

/**
 * Sélecteur de colonnes du mode simple. Il puise dans le même vocabulaire
 * métier que les critères : l'utilisateur qui sait filtrer sur « Service »
 * sait afficher « Service ».
 */
function renderColsPanel(){
  var box = document.getElementById('sColsPanel');
  var cols = S.simpleCols || [];
  var vus = {}, html = '', grp = '';

  (S.labels || []).forEach(function(L){
    if (L.g !== grp){ grp = L.g; html += '<div class="cgrp">' + esc(grp) + '</div>'; }
    vus[L.p] = 1;
    html += '<label class="copt"><input type="checkbox" data-col="' + esc(L.p) + '"'
          + (cols.indexOf(L.p) !== -1 ? ' checked' : '') + '>' + esc(L.l) + '</label>';
  });

  // colonnes conseillées par une question mais hors vocabulaire courant
  var autres = cols.filter(function(p){ return !vus[p]; });
  if (autres.length){
    html += '<div class="cgrp">' + esc(T('colonneAutre')) + '</div>'
          + autres.map(function(p){
              return '<label class="copt"><input type="checkbox" data-col="' + esc(p) + '" checked>'
                   + esc(labelOf(p)) + '</label>';
            }).join('');
  }

  box.innerHTML = '<div class="ttl">' + esc(T('colonnesTitre')) + '</div>'
    + '<div class="aide">' + esc(T('colonnesAide').replace('{c}', S.catalog.length)) + '</div>'
    + '<div class="cgrid">' + html + '</div>'
    + '<div class="cfoot"><button class="btn" id="sColsReset">' + esc(T('colonnesReinit')) + '</button>'
    + (cols.length > 8 ? '<span class="hint">' + esc(T('colonnesMax').replace('{n}', cols.length)) + '</span>' : '')
    + '</div>';

  document.getElementById('sCols').textContent = T('colonnes').replace('{n}', cols.length);

function toggleSimpleCol(p, actif){
  var cols = (S.simpleCols || []).slice();
  var i = cols.indexOf(p);
  if (actif && i === -1) cols.push(p);
  if (!actif && i !== -1) cols.splice(i, 1);
  if (!cols.length) cols = ['primaryEmail'];      // au moins une colonne
  S.simpleCols = cols;
  S.colsManuelles = true;
  renderColsPanel();
  renderSimple();
}

function applySimpleQuestion(i){
  var q = QUESTIONS[i];
  S.logic = 'AND';
  S.filters = q.f.map(function(f){ return { path: resolvePath(f[0]), op: f[1], val: f[2] }; });
  S.simpleCols = colsDispo(q.c || COLS_DEFAUT);
  S.colsManuelles = false;      // une question rétablit ses colonnes conseillées
  S.questionCols = S.simpleCols.slice();
  S.expertCols = null;          // invalider la sélection experte pour propager la vue conseillée
  S.simpleShown = 25;
  renderColsPanel();
  document.querySelectorAll('#qcards .qc').forEach(function(el){ el.classList.toggle('on', +el.dataset.q === i); });
  renderSRows(); applyQuery();
  if (q.ask){
    var sel = document.querySelector('#sRows .srow .sv');
    if (sel){ sel.focus(); }
  }
}

/** Point unique de changement de combinaison : les deux surfaces restent
    synchronisées et l'état affiché ne peut pas diverger de l'état réel. */
function setLogic(lg){
  S.logic = (lg === 'OR') ? 'OR' : 'AND';

function switchMode(m){
  S.mode = m;
  document.getElementById('banners').innerHTML = '';
  document.body.classList.toggle('simple', m === 'simple');
  document.querySelectorAll('.ms').forEach(function(b){ b.classList.toggle('on', b.dataset.mode === m); });
  if (m === 'simple'){
    S.expertCols = S.cols.slice();
    // un critère posé en expert peut ne pas être exprimable ici : on le dit.
    var hors = S.filters.filter(function(f){ return f.path && S.labelPath.indexOf(f.path) === -1; });
    document.getElementById('sExp').textContent = T('ouvrirExpert');
    renderSRows();
    if (hors.length){
      document.getElementById('sBridge').innerHTML = '';
      banner('warn', T('criteresHors').replace('{n}', hors.length)
        .replace('{p}', hors.map(function(f){ return f.path; }).join(', ')));
    }
  } else {
    if (S.expertCols && S.expertCols.length) S.cols = S.expertCols.slice();
    else if (S.simpleCols && S.simpleCols.length) S.cols = S.simpleCols.slice();
    // La requête suit : les critères vivent déjà dans S.filters, mais la zone
    // de requête experte n'était jamais redessinée — ils s'appliquaient sans
    // être visibles ni modifiables.
    renderFilters();
    document.getElementById('globalSearch').value = S.search || '';
    document.querySelectorAll('[data-lg]').forEach(function(b){
      b.classList.toggle('on', b.dataset.lg === S.logic);
    });
    var n = S.filters.filter(function(f){ return f.path; }).length;
    if (n) toast(T('repriseCriteres').replace('{n}', n));
  }
  google.script.run.apiSetPref('mode', m);
  render();
}

function bindSimple(){
  S.labels = [];  S.labelPath = [];   // construits après indexation

  document.getElementById('qcards').addEventListener('click', function(e){
    var b = e.target.closest('[data-q]'); if (b) applySimpleQuestion(+b.dataset.q);
  });

  document.getElementById('sRows').addEventListener('change', function(e){
    var row = e.target.closest('.srow'); if (!row) return;
    var i = +row.dataset.i;
    if (e.target.classList.contains('sf')){
      S.filters[i].path = e.target.value;
      S.filters[i].val = '';
      var c = S.byPath[e.target.value];
      S.filters[i].op = opsFor(c ? c.type : 'str')[0][0];
      renderSRows();
    } else if (e.target.classList.contains('so')){
      S.filters[i].op = e.target.value;
      renderSRows();
    } else if (e.target.classList.contains('sv')){
      S.filters[i].val = e.target.value;
    }
    S.simpleShown = 25;
    applyQuery();
  });

  document.getElementById('sRows').addEventListener('input', debounce(function(e){
    if (e.target.classList.contains('sv') && e.target.tagName === 'INPUT'){
      var row = e.target.closest('.srow'); if (!row) return;
      var i = +row.dataset.i;
      if (!S.filters[i]) return;
      S.filters[i].val = e.target.value;
      S.simpleShown = 25;
      applyQuery();
    }
  }, 300));

  document.getElementById('sRows').addEventListener('click', function(e){
    if (e.target.hasAttribute('data-sdel')){
      S.filters.splice(+e.target.closest('.srow').dataset.i, 1);
      renderSRows(); applyQuery();
    }
  });

  document.getElementById('sLogic').addEventListener('click', function(e){
    var b = e.target.closest('[data-lg]'); if (b) setLogic(b.dataset.lg);
  });

  document.getElementById('sAdd').addEventListener('click', function(){
    var first = S.labelPath[0]; if (!first) return;
    var c = S.byPath[first];
    S.filters.push({ path: first, op: opsFor(c ? c.type : 'str')[0][0], val: '' });
    renderSRows(); applyQuery();
  });

  document.getElementById('sClear').addEventListener('click', function(){
    S.filters = []; S.search = ''; S.logic = 'AND'; S.simpleCols = [];
    document.querySelectorAll('#qcards .qc').forEach(function(el){ el.classList.remove('on'); });
    renderSRows(); applyQuery();
  });

  document.getElementById('sTable').addEventListener('click', function(e){
    if (e.target.closest('[data-smore]')){ S.simpleShown = (S.simpleShown || 25) + 25; renderSimple(); return; }
    var tr = e.target.closest('[data-srow]');
    if (tr) openUser(+tr.dataset.srow);
  });

  document.getElementById('sCsv').addEventListener('click', function(){
    var keep = S.cols;
    S.cols = (S.simpleCols && S.simpleCols.length) ? S.simpleCols : colsDispo(COLS_DEFAUT);
    exportCsv();
    S.cols = keep;
  });

  document.getElementById('sSheet').addEventListener('click', function(){
    var keep = S.cols;
    S.cols = (S.simpleCols && S.simpleCols.length) ? S.simpleCols : colsDispo(COLS_DEFAUT);
    exportSheet();      // les lignes sont préparées avant l'appel asynchrone
    S.cols = keep;
  });

  document.getElementById('sCols').addEventListener('click', function(){
    var pan = document.getElementById('sColsPanel');
    if (pan.hidden) renderColsPanel();
    pan.hidden = !pan.hidden;
  });

  document.getElementById('sColsPanel').addEventListener('change', function(e){
    if (e.target.dataset.col) toggleSimpleCol(e.target.dataset.col, e.target.checked);
  });

  document.getElementById('sColsPanel').addEventListener('click', function(e){
    if (e.target.id === 'sColsReset'){
      S.simpleCols = (S.questionCols && S.questionCols.length)
        ? S.questionCols.slice() : colsDispo(COLS_DEFAUT);
      S.colsManuelles = false;
      renderColsPanel(); renderSimple();
    }
  });

  document.getElementById('sExp').addEventListener('click', function(){ switchMode('expert'); });

  document.querySelectorAll('.ms').forEach(function(b){
    b.addEventListener('click', function(){ switchMode(this.dataset.mode); });
  });
}

/* ==========================================================================
 *  TUILES KPI (mode simple) — calculées directement via le moteur testOne(f)
 *  Garantit une cohérence mathématique et structurelle absolue (compteur = résultat).
 * ======================================================================== */
var KPIS = [
  { k:'kpiTotal', alert:false, f:[] }
].concat(
  AUDIT_RULES.filter(function(r){ return r.kpiKey; }).map(function(r){
    return { k: r.kpiKey, alert: !!r.kpiAlert, f: r.filters };
  })
).concat([
  { k:'kpiAdmins', alert:false, f:[['calc.estAdmin','eq','true']] },
  { k:'kpiAlertes', alert:true, f:[['calc.nbAlertes','gte','1']] }
]);

function renderKpis(){
  var box = document.getElementById('kpis');
  if (!box) return;
  box.innerHTML = KPIS.map(function(k, i){
    var filters = (k.f || []).map(function(f){
      return { path: resolvePath(f[0]), op: f[1], val: f[2] };
    });
    var v = 0;
    S.rows.forEach(function(r){
      if (!filters.length) { v++; return; }
      var match = filters.every(function(flt){ return testOne(r, flt); });
      if (match) v++;
    });
    return '<button class="kpi' + (k.alert && v > 0 ? ' alert' : '') + '" data-kpi="' + i + '">'
         + '<b>' + nb(v) + '</b><span>' + esc(T(k.k).replace('{s}', v > 1 ? 's' : '')) + '</span></button>';
  }).join('');
}

/* ==========================================================================
 *  ANOMALIES — règles croisées sur l'ensemble des comptes chargés.
 *  Calculées une seule fois par chargement (S.anomalies), à la demande.
 * ======================================================================== */
function computeAnomalies(){
  if (S.anomalies) return S.anomalies;

  var emails = {};
  S.rows.forEach(function(r){
    var u = r.u;
    if (u.primaryEmail) emails[String(u.primaryEmail).toLowerCase()] = u;
    (u.aliases || []).forEach(function(a){ emails[String(a).toLowerCase()] = u; });
  });

  var byName = {}, byPhone = {}, byRecovery = {}, mgrAbsent = [], mgrSuspendu = [];
  S.rows.forEach(function(r){
    var u = r.u;
    var nom = ((u.name && u.name.fullName) || '').trim().toLowerCase();
    if (nom) (byName[nom] = byName[nom] || []).push(r);

    var vus = {};
    (u.phones || []).forEach(function(p){
      var d = String(p.value || '').replace(/\D/g, '');
      if (d.length < 6 || vus[d]) return;
      vus[d] = 1;
      (byPhone[d] = byPhone[d] || []).push(r);
    });

    var rec = String(u.recoveryEmail || '').toLowerCase();
    if (rec) (byRecovery[rec] = byRecovery[rec] || []).push(r);

    (u.relations || []).forEach(function(rel){
      if (rel.type !== 'manager' || !rel.value) return;
      var m = emails[String(rel.value).toLowerCase()];
      if (!m) mgrAbsent.push({ r: r, d: rel.value });
      else if (m.suspended) mgrSuspendu.push({ r: r, d: rel.value });
    });
  });

  function doublons(map){
    var out = [];
    Object.keys(map).forEach(function(k){
      if (map[k].length > 1) map[k].forEach(function(r){ out.push({ r: r, d: k }); });
    });
    return out;
  }

  S.anomalies = [
    { k:'anomNom',         rows: doublons(byName) },
    { k:'anomTel',         rows: doublons(byPhone) },
    { k:'anomRecovery',    rows: doublons(byRecovery) },
    { k:'anomMgrAbsent',   rows: mgrAbsent },
    { k:'anomMgrSuspendu', rows: mgrSuspendu }
  ];
  return S.anomalies;
}

function renderAnomalies(){
  var v = document.getElementById('viewAnomalies');
  var groups = computeAnomalies().filter(function(g){ return g.rows.length; });
  if (!groups.length){
    v.innerHTML = '<div class="anom-empty">' + esc(T('anomAucune')) + '</div>';
    return;
  }
  v.innerHTML = groups.map(function(g){
    return '<div class="anom-h"><strong>' + esc(T(g.k)) + '</strong>'
         + '<span class="tag f">' + esc(T('anomComptes').replace('{n}', g.rows.length)) + '</span></div>'
      + '<table class="pv"><tbody>'
      + g.rows.map(function(x){
          var u = x.r.u;
          return '<tr><td class="v" data-mail="' + esc(u.primaryEmail || '') + '" style="width:34%">' + esc(u.primaryEmail || '') + '</td>'
               + '<td style="width:30%">' + esc((u.name && u.name.fullName) || '') + '</td>'
               + '<td>' + esc(x.d) + '</td></tr>';
        }).join('')

  }).join('');
  v.querySelectorAll('[data-mail]').forEach(function(td){
    td.addEventListener('click', function(){ openByEmail(this.dataset.mail); });
  });

/* ==========================================================================
 *  ORGANIGRAMME DYNAMIQUE (ORG CHART) & GESTION DES COMPTES GÉNÉRIQUES
 * ======================================================================== */

/** Minuscule + suppression des accents, pour des comparaisons stables. */
function deburr_(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

/* Dernier segment d'OU réservé aux comptes non-humains. Comparaison sur le
   segment exact (et non une sous-chaîne du chemin) : sans quoi « /Ressources
   Humaines » ou « /Temps partiel » feraient passer tout le service pour des
   comptes de service. */
var OU_GENERIC = {
  'services':1,'service':1,'salles':1,'salle':1,'materiel':1,'materiels':1,
  'ressources partagees':1,'comptes de service':1,'comptes generiques':1,
  'generiques':1,'robots':1,'bots':1,'invites':1,'visiteurs':1,
  'prestataires':1,'externes':1,'equipements':1,'equipement':1
};

function isGenericAccount(u){
  if (!u) return false;
  var pfx = deburr_(u.primaryEmail).split('@')[0] || '';
  var name = deburr_((u.name && u.name.fullName) || '');
  var seg = deburr_(u.orgUnitPath).split('/').filter(Boolean).pop() || '';

  // 1. Dernier segment d'OU dédié aux comptes non-humains (correspondance exacte)
  if (OU_GENERIC[seg]) return true;

  // 2. Préfixe d'e-mail entièrement générique (boîte de rôle : contact@, rh@…)
  if (/^(admin|contact|support|info|service|technique|helpdesk|billing|facturation|scanner|noreply|no-reply|api|dev|infra|bot|partage|salle|meeting|room|accueil|rh|recrutement|direction|secretariat|commercial|sales|marketing|compta|comptabilite|alert|alertes|notification|notifications|webhook|root|superadmin|administrateur|guest|invite|visiteur|visitor|externe|presta|prestataire|temp)$/.test(pfx)) return true;

  // 3. Modèles avec séparateurs : admin.xxx, xxx.admin, ext-xxx, presta.xxx
  if (/^(admin|adm|guest|invite|invit|ext|externe|presta)[._-]|[._-](admin|adm|guest|invite|ext|presta)$/.test(pfx)) return true;

  // 4. Nom complet contenant un mot-clé non-humain (mot entier, pour éviter de
  //    capturer un patronyme qui contiendrait la sous-chaîne).
  if (/\b(service|salle|room|scanner|bot|robot|generique|equipe|team|prestataire)\b/.test(name)) return true;

  return false;
}

function buildOrgTree(){
  var userMap = {};
  var children = {};
  var managerOf = {};
  var roots = [];
  var nonRattaches = [];
  var genericAccounts = [];

  var isGen = {};
  S.rows.forEach(function(r){
    var mail = String(r.u.primaryEmail || '').toLowerCase();
    userMap[mail] = r;
    if (isGenericAccount(r.u)) isGen[mail] = true;
  });

  // Rattachement d'un compte à son manager, UNIQUEMENT si ce manager existe
  // dans le parc, n'est pas lui-même (auto-manager = erreur de saisie) et n'est
  // pas un compte générique — sans quoi les reports d'un compte de rôle
  // (direction@) deviendraient orphelins et disparaîtraient de l'arbre.
  S.rows.forEach(function(r){
    var u = r.u;
    var mail = String(u.primaryEmail || '').toLowerCase();
    if (isGen[mail]){ genericAccounts.push(r); return; }
    var mgrRel = (u.relations || []).filter(function(rel){ return rel.type === 'manager' && rel.value; })[0];
    var mgrMail = mgrRel ? String(mgrRel.value).toLowerCase() : '';
    if (mgrMail && mgrMail !== mail && userMap[mgrMail] && !isGen[mgrMail]){
      (children[mgrMail] = children[mgrMail] || []).push(mail);
      managerOf[mail] = mgrMail;
    }
  });

  // Racines = comptes non génériques sans manager rattaché ; les feuilles
  // sans manager tombent dans « sans manager ».
  S.rows.forEach(function(r){
    var mail = String(r.u.primaryEmail || '').toLowerCase();
    if (isGen[mail] || managerOf[mail]) return;
    if (children[mail] && children[mail].length) roots.push(mail);
    else nonRattaches.push(r);
  });

  // Filet anti-cycle : on marque tout ce qui est atteignable depuis les racines
  // (le parcours coupe sur un nœud déjà vu), puis on promeut en racine tout
  // manager jamais atteint — c'est-à-dire pris dans une boucle fermée A→B→A.
  var seen = {};
  var stack = roots.slice();
  while (stack.length){
    var m = stack.pop();
    if (seen[m]) continue;
    seen[m] = true;
    (children[m] || []).forEach(function(c){ if (!seen[c]) stack.push(c); });
  }
  Object.keys(children).forEach(function(mgr){
    if (isGen[mgr] || seen[mgr]) return;
    roots.push(mgr);
    var st = [mgr];
    while (st.length){
      var x = st.pop();
      if (seen[x]) continue;
      seen[x] = true;
      (children[x] || []).forEach(function(c){ if (!seen[c]) st.push(c); });
    }
  });

  return {
    userMap: userMap,
    children: children,
    roots: roots,
    nonRattaches: nonRattaches,
    genericAccounts: genericAccounts
  };
}

var S_org = {
  search: '',
  hideGeneric: false,
  collapsed: {},
  zoom: 1,
  rootFocus: ''
};

/* État du panoramique + écouteur mouseup global attaché une seule fois pour tout
   le cycle de vie de la page (voir renderOrgChart). */
var orgDrag = { down: false, el: null, startX: 0, startY: 0, sLeft: 0, sTop: 0 };
var orgMouseupBound = false;
function orgBindGlobalMouseup_(){
  if (orgMouseupBound) return;
  orgMouseupBound = true;
  window.addEventListener('mouseup', function(){
    orgDrag.down = false;
    if (orgDrag.el) orgDrag.el.classList.remove('grabbing');
  });
}

/* Recherche debouncée : restaure la position du curseur passée en argument. */
var orgSearchDebounced = debounce(function(caret){
  renderOrgChart();
  var el = document.getElementById('orgSearchInput');
  if (el){
    el.focus();
    try { el.selectionStart = el.selectionEnd = (caret == null ? el.value.length : caret); }
    catch (e) { /* certains navigateurs refusent selectionStart sur input search */ }
  }
}, 200);

function renderOrgChart(){
  var v = document.getElementById('viewOrgchart');
  var data = buildOrgTree();
  var userMap = data.userMap;
  var children = data.children;
  var roots = data.roots;
  var nonRattaches = data.nonRattaches;
  var genericAccounts = data.genericAccounts;

  var q = (S_org.search || '').toLowerCase();

  // Si une racine spécifique est sélectionnée
  if (S_org.rootFocus && userMap[S_org.rootFocus]){
    roots = [S_org.rootFocus];
  } else {
    S_org.rootFocus = '';
  }

  // Liste de tous les managers ayant des subordonnés pour le sélecteur
  var managersList = Object.keys(children).map(function(m){
    var r = userMap[m];
    var name = (r && r.u && r.u.name && r.u.name.fullName) || m;
    return { mail: m, name: name, count: (children[m] || []).length };
  }).sort(function(a, b){ return a.name.localeCompare(b.name, LOC()); });

  // `seen` partagé sur tout le rendu : chaque compte n'est dessiné qu'une fois,
  // et un rattachement cyclique (A→B→A) est coupé au lieu de boucler à l'infini.
  function renderCard(mail, seen){
    var r = userMap[mail];
    if (!r || seen[mail]) return '';
    seen[mail] = true;
    var u = r.u;
    var ch = children[mail] || [];
    var isColl = !!S_org.collapsed[mail];
    var initials = ((u.name && u.name.givenName || '?')[0] + (u.name && u.name.familyName || '?')[0]).toUpperCase();
    var orgs = u.organizations || [];
    var title = orgs.length && orgs[0].title ? orgs[0].title : '';
    var dept = orgs.length && orgs[0].department ? orgs[0].department : (u.orgUnitPath || '');
    var isMatch = q && (((u.name && u.name.fullName) || '').toLowerCase().indexOf(q) !== -1 || mail.indexOf(q) !== -1 || title.toLowerCase().indexOf(q) !== -1);

    var html = '<li class="' + (isColl ? 'org-collapsed' : '') + '">';
    html += '<div class="org-card' + (isMatch ? ' highlight' : '') + '" data-mail="' + esc(mail) + '">';
    
    if (ch.length && S_org.rootFocus !== mail){
      html += '<button class="org-card-focus" data-focus="' + esc(mail) + '" title="' + esc(T('orgIsolerBranche')) + '">🎯</button>';
    }

    html += '<div class="org-card-top">';
    html += '<div class="org-card-av">' + (u.thumbnailPhotoUrl ? '<img src="' + esc(u.thumbnailPhotoUrl) + '" alt="">' : initials) + '</div>';
    html += '<div style="flex:1;min-width:0">';
    html += '<div class="org-card-name" title="' + esc((u.name && u.name.fullName) || mail) + '">' + esc((u.name && u.name.fullName) || mail) + '</div>';
    html += '<div class="org-card-title" title="' + esc(title) + '">' + esc(title || mail) + '</div>';
    html += '</div></div>';
    if (dept) html += '<div class="org-card-dept" title="' + esc(dept) + '">' + esc(dept) + '</div>';

    if (ch.length){
      html += '<button class="org-card-toggle" data-toggle="' + esc(mail) + '">' + (isColl ? '+' : '−') + ' ' + ch.length + '</button>';
    }
    html += '</div>';

    if (ch.length){
      html += '<ul>';
      ch.forEach(function(cMail){
        html += renderCard(cMail, seen);
      });
      html += '</ul>';
    }
    html += '</li>';
    return html;
  }

  var treeHtml = '';
  if (S_org.rootFocus && userMap[S_org.rootFocus]){
    var focusUser = userMap[S_org.rootFocus].u;
    var focusName = (focusUser.name && focusUser.name.fullName) || S_org.rootFocus;
    treeHtml += '<div class="org-breadcrumb">'
      + '<span>' + esc(T('orgRacineActive')) + '</span>'
      + '<b>' + esc(focusName) + ' (' + esc(S_org.rootFocus) + ')</b>'
      + '<div class="grow"></div>'
      + '<button class="org-breadcrumb-btn" id="btnOrgResetRoot">✕ ' + esc(T('orgVoirTout')) + '</button>'
      + '</div>';
  }

  if (!roots.length){
    treeHtml += '<div class="hint" style="padding:40px;text-align:center;">' + esc(T('orgAucunArbre')) + '</div>';
  } else {
    var rendered = {};
    treeHtml += '<div class="org-tree" id="orgTreeEl" style="transform:scale(' + S_org.zoom + ');"><ul>'
      + roots.map(function(m){ return renderCard(m, rendered); }).join('') + '</ul></div>';
  }

  var sideNonRattaches = nonRattaches.filter(function(r){
    if (!q) return true;
    var u = r.u;
    return (u.primaryEmail || '').toLowerCase().indexOf(q) !== -1 || ((u.name && u.name.fullName) || '').toLowerCase().indexOf(q) !== -1;
  });

  var sideGeneric = genericAccounts.filter(function(r){
    if (!q) return true;
    var u = r.u;
    return (u.primaryEmail || '').toLowerCase().indexOf(q) !== -1 || ((u.name && u.name.fullName) || '').toLowerCase().indexOf(q) !== -1;
  });

  function renderSideItem(r){
    var u = r.u;
    var initials = ((u.name && u.name.givenName || '?')[0] + (u.name && u.name.familyName || '?')[0]).toUpperCase();
    var orgs = u.organizations || [];
    var sub = orgs.length && orgs[0].title ? orgs[0].title : u.primaryEmail;
    return '<div class="org-item" data-mail="' + esc(u.primaryEmail) + '">'
         + '<div class="org-item-av">' + (u.thumbnailPhotoUrl ? '<img src="' + esc(u.thumbnailPhotoUrl) + '" alt="">' : initials) + '</div>'
         + '<div class="org-item-info">'
         + '<div class="org-item-name">' + esc((u.name && u.name.fullName) || u.primaryEmail) + '</div>'
         + '<div class="org-item-sub">' + esc(sub) + '</div>'
         + '</div></div>';
  }

  var rootSelectHtml = '<select class="org-root-select" id="orgRootSelect">'
    + '<option value="">' + esc(T('orgTouteOrg')) + '</option>'
    + managersList.map(function(mgr){
        return '<option value="' + esc(mgr.mail) + '"' + (S_org.rootFocus === mgr.mail ? ' selected' : '') + '>'
             + esc(mgr.name + ' (' + mgr.count + ' N-1)')
             + '</option>';
      }).join('')
    + '</select>';

  v.innerHTML = '<div class="org-wrap">'
    + '<div class="org-bar">'
    + rootSelectHtml
    + '<input type="text" class="org-search" id="orgSearchInput" placeholder="' + esc(T('orgRechercher')) + '" value="' + esc(S_org.search) + '">'
    + '<button class="btn" id="btnOrgExpandAll">' + esc(T('orgDeployerTout')) + '</button>'
    + '<button class="btn" id="btnOrgCollapseAll">' + esc(T('orgReplierTout')) + '</button>'
    + '<div class="org-zoom-group">'
    + '<button class="org-zoom-btn" id="btnOrgZoomOut" title="Zoom −">−</button>'
    + '<span class="org-zoom-lvl" id="orgZoomLvl">' + Math.round(S_org.zoom * 100) + '%</span>'
    + '<button class="org-zoom-btn" id="btnOrgZoomIn" title="Zoom +">+</button>'
    + '<button class="org-zoom-btn" id="btnOrgZoomReset" title="100%">1:1</button>'
    + '</div>'
    + '<div class="grow"></div>'
    + '<label class="tchk"><input type="checkbox" id="orgHideGen" ' + (S_org.hideGeneric ? 'checked' : '') + '> ' + esc(T('orgMasquerTech')) + '</label>'
    + '</div>'
    + '<div class="org-layout">'
    + '<div class="org-main" id="orgMainEl">' + treeHtml + '</div>'
    + '<div class="org-side">'
    + '<div class="org-panel">'
    + '<div class="org-panel-h"><strong>' + esc(T('orgSansMgr')) + '</strong><span class="tag f">' + nonRattaches.length + '</span></div>'
    + '<div class="org-panel-list">' + (sideNonRattaches.length ? sideNonRattaches.map(renderSideItem).join('') : '<div class="hint">Aucun</div>') + '</div>'
    + '</div>'
    + (S_org.hideGeneric ? '' : '<div class="org-panel">'
    + '<div class="org-panel-h"><strong>' + esc(T('orgComptesTech')) + '</strong><span class="tag f">' + genericAccounts.length + '</span></div>'
    + '<div class="org-panel-list">' + (sideGeneric.length ? sideGeneric.map(renderSideItem).join('') : '<div class="hint">Aucun</div>') + '</div>'
    + '</div>')
    + '</div>'
    + '</div>'
    + '</div>';

  // Event handlers
  var rootSel = document.getElementById('orgRootSelect');
  if (rootSel){
    rootSel.addEventListener('change', function(){
      S_org.rootFocus = this.value;
      renderOrgChart();
    });
  }

  var resetRootBtn = document.getElementById('btnOrgResetRoot');
  if (resetRootBtn){
    resetRootBtn.addEventListener('click', function(){
      S_org.rootFocus = '';
      renderOrgChart();
    });
  }

  var searchInput = document.getElementById('orgSearchInput');
  if (searchInput){
    // Debounce : sur 9 000 comptes, reconstruire l'arbre à chaque frappe gèle
    // l'UI. On mémorise aussi la position du curseur pour la restaurer après le
    // re-rendu (l'input est recréé), au lieu de la forcer en fin de champ.
    searchInput.addEventListener('input', function(){
      S_org.search = this.value;
      orgSearchDebounced(this.selectionStart);
    });
  }

  var hideGen = document.getElementById('orgHideGen');
  if (hideGen){
    hideGen.addEventListener('change', function(){
      S_org.hideGeneric = this.checked;
      renderOrgChart();
    });
  }

  var expAll = document.getElementById('btnOrgExpandAll');
  if (expAll){
    expAll.addEventListener('click', function(){
      S_org.collapsed = {};
      renderOrgChart();
    });
  }

  var collAll = document.getElementById('btnOrgCollapseAll');
  if (collAll){
    collAll.addEventListener('click', function(){
      Object.keys(children).forEach(function(m){ S_org.collapsed[m] = true; });
      renderOrgChart();
    });
  }

  function setZoom(val){
    S_org.zoom = Math.max(0.3, Math.min(1.8, Math.round(val * 100) / 100));
    var tree = document.getElementById('orgTreeEl');
    if (tree) tree.style.transform = 'scale(' + S_org.zoom + ')';
    var lvl = document.getElementById('orgZoomLvl');
    if (lvl) lvl.textContent = Math.round(S_org.zoom * 100) + '%';
  }

  var zIn = document.getElementById('btnOrgZoomIn');
  if (zIn) zIn.addEventListener('click', function(){ setZoom(S_org.zoom + 0.15); });

  var zOut = document.getElementById('btnOrgZoomOut');
  if (zOut) zOut.addEventListener('click', function(){ setZoom(S_org.zoom - 0.15); });

  var zRst = document.getElementById('btnOrgZoomReset');
  if (zRst) zRst.addEventListener('click', function(){ setZoom(1); });

  // Panoramique par glisser-déposer. mainEl est recréé à chaque rendu (ses
  // écouteurs disparaissent avec lui), mais le mouseup vit sur window : il ne
  // doit être attaché qu'UNE fois, sinon les handlers s'empilent à chaque rendu.
  var mainEl = document.getElementById('orgMainEl');
  if (mainEl){
    orgBindGlobalMouseup_();
    mainEl.addEventListener('mousedown', function(e){
      if (e.target.closest('button') || e.target.closest('input') || e.target.closest('select')) return;
      orgDrag.down = true;
      orgDrag.el = mainEl;
      mainEl.classList.add('grabbing');
      orgDrag.startX = e.pageX - mainEl.offsetLeft;
      orgDrag.startY = e.pageY - mainEl.offsetTop;
      orgDrag.sLeft = mainEl.scrollLeft;
      orgDrag.sTop = mainEl.scrollTop;
    });
    mainEl.addEventListener('mousemove', function(e){
      if (!orgDrag.down) return;
      e.preventDefault();
      mainEl.scrollLeft = orgDrag.sLeft - ((e.pageX - mainEl.offsetLeft) - orgDrag.startX);
      mainEl.scrollTop = orgDrag.sTop - ((e.pageY - mainEl.offsetTop) - orgDrag.startY);
    });
  }

  v.querySelectorAll('.org-card-toggle').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var mail = this.dataset.toggle;
      S_org.collapsed[mail] = !S_org.collapsed[mail];
      renderOrgChart();
    });
  });

  v.querySelectorAll('.org-card-focus').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var mail = this.dataset.focus;
      S_org.rootFocus = mail;
      renderOrgChart();
    });
  });

  v.querySelectorAll('[data-mail]').forEach(function(el){
    el.addEventListener('click', function(){
      openByEmail(this.dataset.mail);
    });
  });
}

/* ==========================================================================
 *  CHARGEMENT
 * ======================================================================== */
function load(force){
  var box = document.getElementById('loader');
  box.classList.remove('off');
  S.loadSeq = (S.loadSeq || 0) + 1;
  var seq = S.loadSeq;
  S.raw = []; S.rows = []; S.catalog = []; S.byPath = {}; S.schemas = []; S.legacyTried = false; S.t0 = Date.now(); S.batches = 0; S.cachedAll = true;
  S.anomalies = null;
  S.orgUnit = document.getElementById('ouFilter').value || '';
  S.showDeleted = document.getElementById('showDeleted').checked;
  document.getElementById('banners').innerHTML = '';
  setProgress(0, force ? T('rechargementApi') : T('connexion'));
  nextBatch('', !!force, seq);
}

function nextBatch(token, force, seq){
  google.script.run
    .withSuccessHandler(function(res){ onBatch(res, force, seq); })
    .withFailureHandler(function(e){ onBatchFail(e, force, seq); })
    .apiLoadBatch({ pageToken: token, force: force, loadedCount: S.raw.length,
                    orgUnit: S.orgUnit, showDeleted: S.showDeleted });
}

function onBatchFail(err, force, seq){
  if (seq !== S.loadSeq) return;
  var msg = (err && err.message) ? err.message : String(err);
  if (/introuvable|not found|not a function/i.test(msg) && !S.legacyTried){
    S.legacyTried = true;
    banner('warn', T('deploiementAncien'));
    setProgress(0.15, T('chargementCompat'));
    google.script.run
      .withSuccessHandler(function(res){ onLegacy(res, seq); })
      .withFailureHandler(onFail)
      .apiLoadUsers({ force: !!force });
    return;
  }
  onFail(err);
}

function onLegacy(res, seq){
  if (seq && seq !== S.loadSeq) return;
  if (!res || !res.ok){ onFail({ message: srvMsg(res) }); return; }
  S.source = res.source;
  S.schemas = res.schemas || [];
  if (res.warningCode) S.warning = T(res.warningCode).replace('{e}', res.warning || '');
  else if (res.warning) S.warning = res.warning;
  S.batches = 1;
  S.cachedAll = !!res.cached;
  S.raw = res.users || [];
  S.anomalies = null;
  setProgress(0.6, T('comptesIndexes').replace('{n}', nb(S.raw.length)));
  setTimeout(function(){
    indexRows(S.raw);
    setProgress(1, T('constructionCat'));
    setTimeout(finishLoad, 30);
  }, 30);
}

function onBatch(res, force, seq){
  if (seq !== S.loadSeq) return;
  S.anomalies = null;
  if (!res || !res.ok){
    banner('err', srvMsg(res));
    if (S.raw && S.raw.length > 0) {
      toast(T('chargementIncomplet').replace('{n}', nb(S.raw.length)));
      setProgress(1, T('constructionCat'));
      setTimeout(finishLoad, 30);
    } else {
      document.getElementById('loader').classList.add('off');
    }
    return;
  }
  S.batches++;
  if (!res.cached) S.cachedAll = false;
  S.raw = S.raw.concat(res.users || []);
  if (res.schemas) S.schemas = res.schemas;
  if (res.orgUnits) populateOuFilter(res.orgUnits);
  if (res.source) S.source = res.source;
  if (res.warningCode) S.warning = T(res.warningCode).replace('{e}', res.warning || '');
  else if (res.warning) S.warning = res.warning;
  S.maxUsers = res.maxUsers || 9000;

  // la requête suivante part AVANT l'indexation : réseau et CPU se recouvrent
  if (res.nextPageToken) nextBatch(res.nextPageToken, force, seq);

  indexRows(res.users || []);
  setProgress(S.rows.length / S.maxUsers, T('comptesIndexes').replace('{n}', nb(S.rows.length)));

  if (!res.nextPageToken){
    setProgress(1, T('constructionCat'));
    setTimeout(finishLoad, 30);
  }
}

function finishLoad(){
  buildIndex();
  buildLabels();      // vocabulaire recalé sur les champs réels du domaine
  renderPresets();
  renderQCards();
  renderSRows();
  document.getElementById('loader').classList.add('off');

  var b = document.getElementById('srcBadge');
  b.className = 'badge ' + (S.source === 'api' ? 'api' : 'demo');
  b.textContent = S.source === 'api' ? T('srcApi') : T('srcDemo');
  document.getElementById('topStat').innerHTML =
    '<b>' + nb(S.rows.length) + '</b> ' + esc(T('comptes').replace('{s}', S.rows.length > 1 ? 's' : '')) + ' · <b>' + S.catalog.length + '</b> ' + T('chemins') + ' · '
    + (S.cachedAll ? T('cache') : (Date.now() - S.t0) + ' ms') + ' · ' + S.batches + ' ' + (S.batches > 1 ? T('tranches') : T('tranche'));

  if (S.warning) banner('warn', S.warning);
  if (S.rows.length >= S.maxUsers){
    banner('warn', T('plafondAtteint').replace('{n}', nb(S.rows.length)));
  }
  renderKpis();
  logEvent('load', S.rows.length);
  applyQuery();
}

function setProgress(ratio, txt){
  document.getElementById('loadTxt').textContent = txt;
  var bar = document.getElementById('loadBar');
  if (bar) bar.style.width = Math.min(100, Math.round(ratio * 100)) + '%';
}

function onFail(err){
  document.getElementById('loader').classList.add('off');
  banner('err', T('echecChargement') + (err && err.message ? err.message : err));
}
function banner(kind, msg){
  var d = document.createElement('div');
  d.className = 'banner ' + kind;
  d.textContent = msg;
  document.getElementById('banners').appendChild(d);
}

/* ==========================================================================
 *  ÉVÉNEMENTS
 * ======================================================================== */
function debounce(fn, ms){
  var t; return function(){ var a = arguments, c = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(c, a); }, ms); };
}

document.addEventListener('DOMContentLoaded', function(){

  renderPresets();

  document.getElementById('presets').addEventListener('click', function(e){
    var b = e.target.closest('[data-pre]'); if (!b) return;
    var p = PRESETS[+b.dataset.pre];
    setLogic(p.logic || 'AND');
    S.filters = p.f.map(function(f){
      // @remplissage : substitué par la liste de valeurs de remplissage du
      // domaine, déclarée dans BRAND — jamais de valeur métier en dur ici.
      var v = (f[2] === '@remplissage') ? BRAND.remplissage.join(',') : f[2];
      return { path: resolvePath(f[0]), op: f[1], val: v };
    });
    renderFilters(); applyQuery();
  });

  document.getElementById('btnAddFilter').addEventListener('click', function(){
    S.filters.push({ path: '', op: 'contains', val: '' });
    renderFilters();
    var last = document.querySelector('#filters .frow:last-child .fpath'); if (last) last.focus();
  });

  document.getElementById('segLogic').addEventListener('click', function(e){
    var b = e.target.closest('[data-lg]'); if (!b) return;
    setLogic(b.dataset.lg);
  });

  document.getElementById('btnReset').addEventListener('click', function(){
    S.filters = []; S.search = '';
    document.getElementById('globalSearch').value = '';
    setLogic('AND');
    renderFilters(); applyQuery();
  });

  document.getElementById('filters').addEventListener('input', debounce(function(e){
    var row = e.target.closest('.frow'); if (!row) return;
    var i = +row.dataset.i;
    if (!S.filters[i]) return;
    if (e.target.classList.contains('fpath')){
      S.filters[i].path = e.target.value.trim();
      updateHint(i);
      var c = S.byPath[S.filters[i].path];
      document.getElementById('dlValues').innerHTML = c
        ? c.top.slice(0, 200).map(function(t){ return '<option value="' + esc(t[0]) + '">'; }).join('') : '';
    }
    if (e.target.classList.contains('fval')) S.filters[i].val = e.target.value;
    applyQuery();
  }, 260));

  document.getElementById('filters').addEventListener('change', function(e){
    var row = e.target.closest('.frow'); if (!row) return;
    var i = +row.dataset.i;
    if (!S.filters[i]) return;
    if (e.target.classList.contains('fop')){
      S.filters[i].op = e.target.value;
      applyQuery();
    }
  });

  document.getElementById('filters').addEventListener('click', function(e){
    if (e.target.hasAttribute('data-del')){
      S.filters.splice(+e.target.closest('.frow').dataset.i, 1);
      renderFilters(); applyQuery();
    }
  });

  document.getElementById('globalSearch').addEventListener('input', debounce(function(){
    S.search = this.value; applyQuery();
  }, 260));

  document.getElementById('fieldSearch').addEventListener('input', debounce(renderFieldList, 150));

  document.getElementById('fieldList').addEventListener('click', function(e){
    var f = e.target.closest('.fld'); if (!f) return;
    toggleCol(f.dataset.path);
  });

  document.querySelector('.side-f').addEventListener('click', function(e){
    var b = e.target.closest('[data-cols]'); if (!b) return;
    var k = b.dataset.cols;
    if (k === 'clear'){ S.cols = ['primaryEmail']; }
    else { S.cols = colsDispo(COLSETS[k]); }
    render();
  });

  document.getElementById('viewResults').addEventListener('click', function(e){
    var th = e.target.closest('[data-sort]');
    if (th){
      var p = th.dataset.sort;
      S.sort = { path: p, dir: (S.sort.path === p ? -S.sort.dir : 1) };
      applyQuery(); return;
    }
    var pg = e.target.closest('[data-pg]');
    if (pg){
      var max = Math.ceil(S.result.length / S.pageSize);
      S.page = Math.min(max, Math.max(1, S.page + (+pg.dataset.pg)));
      renderTable(); document.getElementById('viewResults').scrollTop = 0; return;
    }
    var tr = e.target.closest('[data-row]');
    if (tr) openUser(+tr.dataset.row);
  });

  document.querySelectorAll('.tabs .tab').forEach(function(b){
    b.addEventListener('click', function(){ switchTab(this.dataset.tab); });
  });

  document.getElementById('pageSize').addEventListener('change', function(){
    S.pageSize = +this.value; S.page = 1; renderTable();
  });

  document.querySelectorAll('[data-dtab]').forEach(function(b){
    b.addEventListener('click', function(){
      S.dtab = this.dataset.dtab;
      document.querySelectorAll('[data-dtab]').forEach(function(x){ x.classList.toggle('on', x.dataset.dtab === S.dtab); });
      renderDrawer();
    });
  });

  document.getElementById('dClose').addEventListener('click', closeDrawer);
  document.getElementById('scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeDrawer(); });

  document.getElementById('dCopy').addEventListener('click', function(){
    if (!S.current) return;
    var txt = JSON.stringify(S.current.u, null, 2);
    navigator.clipboard.writeText(txt).then(function(){ toast(T('jsonCopie')); },
      function(){ toast(T('copieImpossible')); });
  });

  var dOrgBtn = document.getElementById('dOrg');
  if (dOrgBtn){
    dOrgBtn.addEventListener('click', function(){
      if (!S.current || !S.current.u) return;
      var mail = S.current.u.primaryEmail;
      switchMode('expert');
      switchTab('orgchart');
      S_org.rootFocus = mail;
      closeDrawer();
      renderOrgChart();
    });
  }

  document.getElementById('btnExport').addEventListener('click', exportCsv);
  document.getElementById('btnSheet').addEventListener('click', exportSheet);
  document.getElementById('btnRefresh').addEventListener('click', function(){ load(true); });

  document.getElementById('ouFilter').addEventListener('change', function(){ load(false); });
  document.getElementById('showDeleted').addEventListener('change', function(){
    var ouEl = document.getElementById('ouFilter');
    if (ouEl) ouEl.disabled = this.checked;
    load(false);
  });
  document.getElementById('viewsSel').addEventListener('change', function(){ if (this.value) applyView(this.value); });
  document.getElementById('viewSave').addEventListener('click', saveCurrentView);
  document.getElementById('viewDel').addEventListener('click', deleteCurrentView);
  document.getElementById('btnJournal').addEventListener('click', renderUsageLog);

  document.getElementById('kpis').addEventListener('click', function(e){
    var b = e.target.closest('[data-kpi]'); if (!b) return;
    var k = KPIS[+b.dataset.kpi];
    S.logic = 'AND';
    S.filters = k.f.map(function(f){ return { path: resolvePath(f[0]), op: f[1], val: f[2] }; });
    S.simpleShown = 25;
    document.querySelectorAll('#qcards .qc').forEach(function(el){ el.classList.remove('on'); });
    renderSRows(); applyQuery();
  });

  document.getElementById('btnAbout').addEventListener('click', function(){
    document.getElementById('modalAbout').classList.add('on');
  });
  document.getElementById('btnAboutClose').addEventListener('click', function(){
    document.getElementById('modalAbout').classList.remove('on');
  });
  document.getElementById('modalAbout').addEventListener('click', function(e){
    if (e.target === this) this.classList.remove('on');
  });

  // Modale de sauvegarde de vue
  var btnSaveCancel = document.getElementById('btnSaveViewCancel');
  if (btnSaveCancel) btnSaveCancel.addEventListener('click', closeSaveViewModal);

  var btnSaveConfirm = document.getElementById('btnSaveViewConfirm');
  if (btnSaveConfirm){
    btnSaveConfirm.addEventListener('click', function(){
      var input = document.getElementById('viewNameInput');
      var name = (input.value || '').trim();
      if (!name){ toast(T('nomRequis')); return; }
      S.views[name] = {
        mode: S.mode, logic: S.logic, search: S.search,
        sort: { path: S.sort.path, dir: S.sort.dir },
        filters: S.filters.map(function(f){ return { path: f.path, op: f.op, val: f.val }; }),
        cols: S.cols.slice(), simpleCols: (S.simpleCols || []).slice()
      };
      persistViews();
      renderViewsMenu();
      document.getElementById('viewsSel').value = name;
      closeSaveViewModal();
      toast(T('vueEnregistree').replace('{v}', name));
    });
  }

  var viewInput = document.getElementById('viewNameInput');
  if (viewInput){
    viewInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('btnSaveViewConfirm').click();
      else if (e.key === 'Escape') closeSaveViewModal();
    });
  }

  var modalSave = document.getElementById('modalSaveView');
  if (modalSave){
    modalSave.addEventListener('click', function(e){
      if (e.target === this) closeSaveViewModal();
    });
  }

  document.getElementById('brand').insertAdjacentHTML('afterbegin',
    esc(BRAND.nom) + '&nbsp;<em>' + esc(BRAND.suffixe) + '</em>');
  renderFilters();
  bindSimple();
  document.getElementById('langsw').addEventListener('click', function(e){
    var b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang);
  });

  google.script.run.withSuccessHandler(function(p){
    p = p || {};
    LANG = (p.lang === 'en') ? 'en' : (p.lang === 'fr') ? 'fr'
         : (String(p.locale).toLowerCase().indexOf('en') === 0 ? 'en' : 'fr');
    applyStatic();
    try { S.views = JSON.parse(p.views || '{}') || {}; } catch (e) { S.views = {}; }
    renderViewsMenu();
    switchModeSilent(p.mode === 'expert' ? 'expert' : 'simple');
    load(false);
  }).withFailureHandler(function(){
    applyStatic(); renderViewsMenu(); switchModeSilent('simple'); load(false);
  }).apiInit();
});

/** Applique le mode sans rendu ni écriture de préférence (amorçage). */
/** Traduit un message d'erreur venu du serveur, qui ne connaît pas la langue. */
function srvMsg(res){
  if (!res) return T('reponseInvalide');
  if (res.errorCode === 'accesRefuse') return T('accesRefuse').replace('{u}', res.user || '').replace('{r}', res.reason || '');
  if (res.errorCode === 'adminSdk') return T('erreurAdminSdk').replace('{e}', res.error || '');
  return res.error || T('reponseInvalide');
}

function switchModeSilent(m){
  S.mode = m;
  document.body.classList.toggle('simple', m === 'simple');
  document.querySelectorAll('.ms').forEach(function(b){ b.classList.toggle('on', b.dataset.mode === m); });
}
</script>
